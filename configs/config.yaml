seed: 42

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs

data:
  labeled:
    cn7: moldset_labeled_cn7.csv
    rg3: moldset_labeled_rg3.csv
  unlabeled:
    cn7: moldset_unlabeled_cn7.csv
    rg3: moldset_unlabeled_rg3.csv
  target: PassOrFail
  drop_cols: ["Unnamed: 0", "Clamp_Open_Position"]
  drop_duplicates: true

cv:
  n_splits: 5
  n_repeats: 5

models:
  baseline: logistic_regression
  candidates: [random_forest, lightgbm, xgboost, catboost]

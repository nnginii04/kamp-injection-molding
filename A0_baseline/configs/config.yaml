seed: 42

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs

data:
  labeled:
    cn7: moldset_labeled_cn7.csv
    rg3: moldset_labeled_rg3.csv
  unlabeled:
    cn7: moldset_unlabeled_cn7.csv
    rg3: moldset_unlabeled_rg3.csv
  index_col: "Unnamed: 0"
  target: PassOrFail
  drop_cols: [Clamp_Open_Position]
  # unlabeled에서 6개 센서가 동시에 최솟값(원본 0 추정)이면 미기록(대기) 행으로 표시
  idle_sensor_cols:
    - Max_Screw_RPM
    - Average_Screw_RPM
    - Average_Back_Pressure
    - Barrel_Temperature_1
    - Mold_Temperature_3
    - Mold_Temperature_4

split:
  holdout_frac: 0.2
  n_splits: 5
  n_repeats: 5

models:
  baseline: [logistic, random_forest]
  save_all_folds: false      # true면 25개 fold 모델 전부 저장, false면 rep0 fold + final만
  logistic:
    C: 1.0
    class_weight: balanced
    max_iter: 2000
  random_forest:
    n_estimators: 500
    min_samples_leaf: 2
    class_weight: balanced_subsample
    n_jobs: -1
